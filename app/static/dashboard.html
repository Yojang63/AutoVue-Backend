<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OBD-II Simulator Control Panel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --border: #262f45;
    --text: #e6e9f0; --muted: #8891a7; --accent: #4f8cff;
    --good: #35c86a; --warn: #f2b134; --bad: #ef4b5f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
  .pill-stopped { background: #2a3348; color: var(--muted); }
  .pill-running { background: rgba(53,200,106,0.15); color: var(--good); }
  .pill-paused { background: rgba(242,177,52,0.15); color: var(--warn); }
  .pill-finished { background: rgba(79,140,255,0.15); color: var(--accent); }
  main { padding: 20px 24px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin: 0 0 12px; }
  .full-width { grid-column: 1 / -1; }
  select, input[type=text], button { background: #1c2436; border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  button { cursor: pointer; transition: background 0.15s; }
  button:hover { background: #24304a; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { background: #3d78e6; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .speed-btns button.active { background: var(--accent); border-color: var(--accent); }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .metric-card { background: #1c2436; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .metric-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .metric-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .metric-card .unit { font-size: 12px; color: var(--muted); font-weight: 400; }
  .progress-bar { height: 8px; background: #1c2436; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .stat-line { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .stat-line:last-child { border-bottom: none; }
  .stat-line span:last-child { color: var(--muted); }
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-box { background: #1c2436; border-radius: 10px; padding: 10px; height: 200px; }
  #logBox { height: 220px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #0c1119; border-radius: 8px; padding: 10px; }
  .log-info { color: var(--muted); }
  .log-warning { color: var(--warn); }
  .log-error { color: var(--bad); }
  .dataset-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .dataset-item:hover { background: #1c2436; }
  .dataset-item.active { background: rgba(79,140,255,0.12); }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot-online { background: var(--good); } .dot-offline { background: var(--bad); }
</style>
</head>
<body>

<header>
  <h1>🚗 OBD-II Vehicle Data Simulator</h1>
  <div>
    <span id="connDot" class="conn-dot dot-offline"></span>
    <span id="connLabel" style="font-size:13px;color:var(--muted)">Connecting...</span>
    &nbsp;&nbsp;
    <span id="statePill" class="status-pill pill-stopped">stopped</span>
  </div>
</header>

<main>
  <!-- LEFT COLUMN -->
  <div style="display:flex; flex-direction:column; gap:20px;">

    <div class="panel">
      <h2>Dataset Management</h2>
      <div id="datasetList" style="margin-bottom:10px; max-height:140px; overflow-y:auto;"></div>
      <div class="row">
        <input type="file" id="uploadInput" accept=".csv,.xlsx,.xls" style="flex:1; font-size:12px;">
      </div>
      <button class="primary" style="width:100%" onclick="uploadDataset()">Upload Dataset</button>
    </div>

    <div class="panel">
      <h2>Simulation Controls</h2>
      <div class="control-grid" style="margin-bottom:10px;">
        <button class="primary" onclick="callApi('start')">▶ Start</button>
        <button onclick="callApi('pause')">⏸ Pause</button>
        <button onclick="callApi('resume')">⏵ Resume</button>
        <button onclick="callApi('stop')">⏹ Stop</button>
        <button onclick="callApi('reset')">⟲ Restart</button>
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" id="loopCheck" checked onchange="setLoop()"> Loop
        </label>
      </div>
      <div style="font-size:12px; color:var(--muted); margin-bottom:4px;">Playback Speed</div>
      <div class="row speed-btns" id="speedBtns"></div>
    </div>

    <div class="panel">
      <h2>Statistics</h2>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="stat-line"><span>Current Row</span><span id="statRow">0 / 0</span></div>
      <div class="stat-line"><span>Playback %</span><span id="statPct">0%</span></div>
      <div class="stat-line"><span>Elapsed / Duration</span><span id="statTime">0s / 0s</span></div>
      <div class="stat-line"><span>Speed</span><span id="statSpeed">1x</span></div>
      <div class="stat-line"><span>Active Dataset</span><span id="statDataset">-</span></div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div style="display:flex; flex-direction:column; gap:20px;">

    <div class="panel">
      <h2>Live Vehicle Data</h2>
      <div class="metric-grid" id="metricGrid"></div>
    </div>

    <div class="panel">
      <h2>Live Charts</h2>
      <div class="charts-grid">
        <div class="chart-box"><canvas id="chartRpm"></canvas></div>
        <div class="chart-box"><canvas id="chartSpeed"></canvas></div>
        <div class="chart-box"><canvas id="chartThrottle"></canvas></div>
        <div class="chart-box"><canvas id="chartCoolant"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h2>Logs</h2>
      <div id="logBox"></div>
    </div>
  </div>
</main>

<script>
const API = "";
const METRICS = [
  {key: "rpm", label: "Engine RPM", unit: "RPM"},
  {key: "vss", label: "Speed", unit: "km/h"},
  {key: "coolant_temp", label: "Coolant Temp", unit: "°C"},
  {key: "throttle_pos", label: "Throttle", unit: "%"},
  {key: "maf", label: "Air Flow", unit: "g/s"},
  {key: "map_kpa", label: "MAP", unit: "kPa"},
  {key: "ambient_temp", label: "Ambient Temp", unit: "°C"},
  {key: "intake_air_temp", label: "Intake Temp", unit: "°C"},
  {key: "pedal_d", label: "Pedal Position", unit: "%"},
];
const SPEEDS = [0.5, 1, 2, 5, 10];
let activeDatasetId = null;

// ---------- metric cards ----------
function buildMetricCards() {
  const grid = document.getElementById("metricGrid");
  grid.innerHTML = METRICS.map(m => `
    <div class="metric-card">
      <div class="label">${m.label}</div>
      <div class="value" id="metric-${m.key}">--<span class="unit"> ${m.unit}</span></div>
    </div>`).join("");
}
function buildSpeedButtons() {
  const box = document.getElementById("speedBtns");
  box.innerHTML = SPEEDS.map(s => `<button data-speed="${s}" onclick="setSpeed(${s})">${s}x</button>`).join("");
}
buildMetricCards();
buildSpeedButtons();

// ---------- charts ----------
function makeChart(ctx, label, color) {
  return new Chart(ctx, {
    type: "line",
    data: { labels: [], datasets: [{ label, data: [], borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.25 }] },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      scales: { x: { display: false }, y: { ticks: { color: "#8891a7" }, grid: { color: "#262f45" } } },
      plugins: { legend: { labels: { color: "#8891a7", font: {size: 11} } } }
    }
  });
}
const charts = {
  rpm: makeChart(document.getElementById("chartRpm"), "RPM", "#4f8cff"),
  vss: makeChart(document.getElementById("chartSpeed"), "Speed (km/h)", "#35c86a"),
  throttle_pos: makeChart(document.getElementById("chartThrottle"), "Throttle (%)", "#f2b134"),
  coolant_temp: makeChart(document.getElementById("chartCoolant"), "Coolant (°C)", "#ef4b5f"),
};
function pushChartPoint(chart, label, value) {
  const d = chart.data;
  d.labels.push(label);
  d.datasets[0].data.push(value);
  if (d.labels.length > 60) { d.labels.shift(); d.datasets[0].data.shift(); }
  chart.update("none");
}

// ---------- REST helpers ----------
async function callApi(action, body = {}) {
  const res = await fetch(`${API}/api/${action}`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  });
  return res.json();
}
async function setSpeed(s) {
  await callApi("speed", { speed: s });
  document.querySelectorAll("#speedBtns button").forEach(b => b.classList.toggle("active", +b.dataset.speed === s));
}
async function setLoop() {
  await callApi("loop", { loop: document.getElementById("loopCheck").checked });
}
async function loadDatasets() {
  const res = await fetch(`${API}/api/datasets`);
  const { datasets } = await res.json();
  const box = document.getElementById("datasetList");
  box.innerHTML = datasets.map(d => `
    <div class="dataset-item ${d.dataset_id === activeDatasetId ? 'active' : ''}">
      <span title="${d.filename}">${d.filename.slice(0, 28)}${d.filename.length > 28 ? '…' : ''} (${d.row_count} rows)</span>
      <button style="font-size:11px; padding:2px 8px;" onclick="selectDataset('${d.dataset_id}')">Use</button>
    </div>`).join("") || "<div style='color:var(--muted); font-size:13px;'>No datasets found</div>";
}
async function selectDataset(id) {
  activeDatasetId = id;
  await callApi("change-dataset", { dataset_id: id });
  loadDatasets();
}
async function uploadDataset() {
  const input = document.getElementById("uploadInput");
  if (!input.files.length) return alert("Choose a file first");
  const form = new FormData();
  form.append("file", input.files[0]);
  await fetch(`${API}/api/upload`, { method: "POST", body: form });
  input.value = "";
  loadDatasets();
}

// ---------- status polling (backstops the WebSocket) ----------
async function pollStatus() {
  const res = await fetch(`${API}/api/status`);
  const s = await res.json();
  activeDatasetId = s.dataset_id;
  document.getElementById("statePill").textContent = s.state;
  document.getElementById("statePill").className = `status-pill pill-${s.state}`;
  document.getElementById("progressFill").style.width = `${s.playback_percent}%`;
  document.getElementById("statRow").textContent = `${s.current_row} / ${s.total_rows}`;
  document.getElementById("statPct").textContent = `${s.playback_percent}%`;
  document.getElementById("statTime").textContent = `${s.elapsed_playback_seconds}s / ${s.dataset_duration_seconds}s`;
  document.getElementById("statSpeed").textContent = `${s.speed}x`;
  document.getElementById("statDataset").textContent = s.dataset_name || "-";
  document.querySelectorAll("#speedBtns button").forEach(b => b.classList.toggle("active", +b.dataset.speed === s.speed));
}
setInterval(pollStatus, 2000);
pollStatus();
loadDatasets();

// ---------- WebSocket: live telemetry ----------
function connectWs(path, onMessage) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}${path}`);
  ws.onopen = () => { document.getElementById("connDot").className = "conn-dot dot-online"; document.getElementById("connLabel").textContent = "Live"; };
  ws.onclose = () => {
    document.getElementById("connDot").className = "conn-dot dot-offline";
    document.getElementById("connLabel").textContent = "Reconnecting...";
    setTimeout(() => connectWs(path, onMessage), 1500);
  };
  ws.onmessage = (evt) => onMessage(JSON.parse(evt.data));
  return ws;
}

connectWs("/api/ws/live", (payload) => {
  const d = payload.data;
  METRICS.forEach(m => {
    const el = document.getElementById(`metric-${m.key}`);
    const v = d[m.key];
    el.innerHTML = `${v === null || v === undefined ? "--" : v.toFixed(1)}<span class="unit"> ${m.unit}</span>`;
  });
  const t = payload.elapsed_seconds.toFixed(1);
  pushChartPoint(charts.rpm, t, d.rpm);
  pushChartPoint(charts.vss, t, d.vss);
  pushChartPoint(charts.throttle_pos, t, d.throttle_pos);
  pushChartPoint(charts.coolant_temp, t, d.coolant_temp);
});

connectWs("/api/ws/logs", (entry) => {
  const box = document.getElementById("logBox");
  const time = new Date(entry.timestamp * 1000).toLocaleTimeString();
  box.innerHTML += `<div class="log-${entry.level}">[${time}] ${entry.message}</div>`;
  box.scrollTop = box.scrollHeight;
});
</script>

</body>
</html>
